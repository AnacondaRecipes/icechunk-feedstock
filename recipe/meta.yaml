{% set name = "icechunk" %}
{% set version = "2.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 50b82ae35064c1f77ef44dcdc77c13164b11c457cb802aafc402402fe4f38010

build:
  number: 0
  # upstream requires-python = ">=3.12"
  skip: true  # [py<312]
  script:
    # pip -vv relays cargo/rustc output containing non-ASCII; the Windows console
    # default code page raises UnicodeEncodeError and aborts the build.
    - set PYTHONUTF8=1  # [win]
    - set PYTHONIOENCODING=utf-8  # [win]
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - icechunk = icechunk._icechunk_python:cli_entrypoint

requirements:
  build:
    # aws-lc-sys and zstd-sys compile bundled C sources during the cargo build.
    # aws-lc-sys can fall back to cmake::Config if its cc builder is not viable
    # for a target; every current platform takes the cc path, so cmake is not
    # declared here.
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python
    - pip
    # pyproject.toml [build-system].requires
    - maturin >=1.7,<2.0
  run:
    - python
    # pyproject.toml [project].dependencies
    - zarr >=3.1.0

test:
  imports:
    - icechunk
  commands:
    - pip check
    - icechunk --help
    # maturin takes the version from Cargo.toml, not from this recipe.
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # Exercise the storage engine itself: commit to an in-memory repo and read back.
    - python -c "import icechunk, zarr; r = icechunk.Repository.create(icechunk.in_memory_storage()); s = r.writable_session('main'); g = zarr.create_group(s.store); a = g.create_array('x', shape=(4,), dtype='int32'); a[:] = [1,2,3,4]; s.commit('smoke'); rs = r.readonly_session(branch='main'); assert zarr.open_group(rs.store, mode='r')['x'][0] == 1"
    - test -f $SP_DIR/icechunk/_icechunk_python.abi3.so   # [unix]
    - if not exist %SP_DIR%\icechunk\_icechunk_python.pyd exit 1  # [win]
  requires:
    - pip

about:
  home: https://icechunk.io
  license: Apache-2.0
  license_family: Apache
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Transactional storage engine for Zarr designed for use on cloud object storage
  description: |
    Icechunk is an open-source, transactional storage engine for tensor / ND-array
    data designed for use on cloud object storage. Icechunk works together with
    Zarr, augmenting the Zarr core data model with features that enhance
    performance, collaboration, and safety in a cloud-computing context:
    serializable isolation, time travel, data version control, and support for
    virtual references to data stored in other formats. The storage engine is
    written in Rust and exposed to Python through PyO3.
  doc_url: https://icechunk.io
  dev_url: https://github.com/earth-mover/icechunk

extra:
  recipe-maintainers:
    - xkong-anaconda
    - ianhi
    - li-em
    - TomNicholas
